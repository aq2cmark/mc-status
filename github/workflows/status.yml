name: Minecraft status loop

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mc-status-loop
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Watch server (5s checks)
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MC_HOST: ${{ secrets.MC_HOST }}
          MC_PORT: ${{ secrets.MC_PORT }}
        run: node check.js

      - name: Save status if it changed
        if: always()
        run: |
          if ! git diff --quiet status.json; then
            git config user.name "status-bot"
            git config user.email "status-bot@users.noreply.github.com"
            git add status.json
            git commit -m "Update status"
            git push
          fi
